<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobs - Video Studio</title>
<style>
  :root { --bg:#f6f6f4; --panel:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e2e2de; --accent:#2f6fed; --accent-ink:#fff;
          --accent-soft:#edf2ff; --ok:#1f9d55; --warn:#c77800; --bad:#d23c3c; --field:#fbfbfa; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141416; --panel:#1d1d20; --ink:#ececee; --muted:#9a9aa2; --line:#303036;
          --accent:#5b8cff; --accent-ink:#fff; --accent-soft:#1b2436; --field:#18181b; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:14px 20px; border-bottom:1px solid var(--line);
           background:var(--panel); position:sticky; top:0; z-index:2; }
  header h1 { font-size:18px; margin:0 6px 0 0; }
  .tabs { display:flex; gap:4px; flex-wrap:wrap; }
  .tabs a { font-size:13px; color:var(--muted); text-decoration:none; padding:6px 12px; border-radius:999px; }
  .tabs a:hover { background:var(--field); }
  .tabs a.on { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; background:var(--bad); margin-right:6px; }
  .dot.on { background:var(--ok); }
  main { max-width:1180px; margin:auto; padding:22px; }
  h2 { font-size:16px; margin:0 0 12px; display:flex; align-items:center; gap:8px; }
  h2 .count { font-size:12px; font-weight:500; color:var(--muted); background:var(--field); border:1px solid var(--line);
              border-radius:999px; padding:1px 9px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .ctop { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .card h3 { margin:0 0 2px; font-size:15px; word-break:break-word; }
  .sub { color:var(--muted); font-size:12.5px; }
  .pill { font-size:11px; padding:2px 9px; border-radius:999px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
  .pill.running { background:#fff4e0; color:var(--warn); border-color:#f0d6a8; }
  .pill.error { background:#fdecec; color:var(--bad); border-color:#f2c9c9; }
  .pill.done { background:#e9f7ef; color:var(--ok); border-color:#bfe6cf; }
  @media (prefers-color-scheme: dark) {
    .pill.running { background:#2a2113; } .pill.error { background:#2c1818; } .pill.done { background:#13251a; } }
  .bar { background:var(--field); border:1px solid var(--line); border-radius:6px; height:10px; overflow:hidden; margin:14px 0 8px; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .4s; }
  .metrics { display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; font-size:13px; color:var(--muted); }
  .metrics .big { font-size:22px; font-weight:700; color:var(--ink); }
  .stage { font-size:12.5px; color:var(--muted); margin-top:8px; min-height:1.2em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .acts { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  button, .btn { font:inherit; font-size:13px; border-radius:8px; border:1px solid var(--line); background:var(--field);
                 color:var(--ink); padding:7px 12px; cursor:pointer; text-decoration:none; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
  .empty { border:1px dashed var(--line); border-radius:12px; padding:40px; text-align:center; color:var(--muted); }
  .empty b { color:var(--ink); }
  .hist { display:flex; gap:14px; padding:12px; align-items:stretch; }
  .thumb { width:84px; height:112px; object-fit:cover; border-radius:8px; background:#0001; flex:0 0 auto; }
  .cbody { flex:1; min-width:0; display:flex; flex-direction:column; }
  .cbody .acts { margin-top:auto; padding-top:10px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:14px; margin-bottom:22px; }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .tile .v { font-size:26px; font-weight:700; line-height:1.1; }
  .tile .k { font-size:12px; color:var(--muted); margin-top:4px; }
  .chart { display:flex; align-items:flex-end; gap:10px; height:120px; padding:10px 4px 0; }
  .chart .col { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
  .chart .bar2 { width:100%; background:var(--accent); border-radius:5px 5px 0 0; opacity:.85; min-height:2px; }
  .chart .lbl { font-size:11px; color:var(--muted); }
  .section { margin-bottom:26px; }
  .list { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .row { display:flex; align-items:center; gap:12px; padding:10px 14px; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .row .nm { font-weight:600; font-size:14px; }
  .row .meta { color:var(--muted); font-size:12px; margin-left:auto; text-align:right; }
  a.nl { color:var(--accent); text-decoration:none; }
  .err { color:var(--bad); }
  .foot { color:var(--muted); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>Video Studio</h1>
  <nav class="tabs" id="nav">
    <a href="/">Create video</a>
    <a href="/motion">Motion control</a>
    <a href="/jobs" data-p="jobs">Jobs</a>
    <a href="/history" data-p="history">History</a>
    <a href="/dashboard" data-p="dashboard">Dashboard</a><a href="/graph" data-p="graph">Graph</a>
  </nav>
  <span style="flex:1"></span>
  <span><span id="comfyDot" class="dot"></span><span id="comfyTxt">ComfyUI...</span></span>
</header>
<main id="main"></main>
<script>
const $ = id => document.getElementById(id);
const page = (location.pathname.replace(/\/+$/, "") || "/");
const PAGE = page === "/history" ? "history" : page === "/dashboard" ? "dashboard" : "jobs";
document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.p === PAGE));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const dur = s => s == null ? "-" : s < 60 ? Math.max(1, Math.round(s)) + "s"
  : s < 3600 ? Math.floor(s / 60) + "m " + Math.round(s % 60) + "s"
  : Math.floor(s / 3600) + "h " + Math.round((s % 3600) / 60) + "m";
function ago(ts) {
  if (!ts) return "";
  const d = Math.max(0, Date.now() / 1000 - ts);
  if (d < 60) return "just now";
  if (d < 3600) return Math.floor(d / 60) + "m ago";
  if (d < 86400) return Math.floor(d / 3600) + "h ago";
  return Math.floor(d / 86400) + "d ago";
}
const KIND = k => k === "motion" ? "Motion swap" : "Video";
const primaryOut = h => (h.outputs || []).find(f => f === "motion_720p.mp4") ||
  (h.outputs || []).find(f => f.endsWith(".mp4")) || (h.outputs || [])[0];

function activeCard(i) {
  const running = i.status === "running";
  const pct = running ? Math.max(0, Math.min(100, i.percent || 0)) : 0;
  const eta = running ? (i.eta != null ? dur(i.eta) : "estimating...") : "-";
  return `<article class="card">
    <div class="ctop">
      <div><h3>${esc(i.name)}</h3><div class="sub">${KIND(i.kind)}</div></div>
      <span class="pill ${running ? "running" : ""}">${running ? "Generating" : "Queued" + (i.queue_pos ? " #" + i.queue_pos : "")}</span>
    </div>
    ${running ? `
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="metrics"><span class="big">${pct.toFixed(0)}%</span><span>ETA ${eta}</span><span>elapsed ${dur(i.elapsed)}</span></div>
      <div class="stage">${esc(i.stage || "starting...")}</div>`
    : `<div class="stage">Waiting for the GPU. Starts automatically.</div>`}
    <div class="acts"><button data-stop="${esc(i.name)}">${running ? "Stop" : "Remove from queue"}</button></div>
  </article>`;
}

function histCard(h) {
  const out = primaryOut(h);
  const openHref = (h.kind === "motion" ? "/motion" : "/") + "?job=" + encodeURIComponent(h.name);
  const took = h.duration_min != null ? h.duration_min.toFixed(1) + " min" : (h.finished ? ago(h.finished) : "-");
  return `<article class="card hist">
    <img class="thumb" loading="lazy" src="/api/thumb?name=${encodeURIComponent(h.name)}" alt="">
    <div class="cbody">
      <div class="ctop"><h3>${esc(h.name)}</h3><span class="pill ${h.status === "error" ? "error" : "done"}">${h.status === "error" ? "Failed" : "Done"}</span></div>
      <div class="sub">${KIND(h.kind)} &middot; ${h.finished ? ago(h.finished) : ""} &middot; ${h.status === "error" ? "stopped" : "took " + took}</div>
      <div class="acts">
        <a class="btn" href="${openHref}">Open</a>
        ${out ? `<a class="btn" href="/files/${encodeURIComponent(h.name)}/${encodeURIComponent(out)}" target="_blank">${esc(out)}</a>` : ""}
      </div>
    </div>
  </article>`;
}

function renderJobs(d) {
  const a = d.active || [];
  $("main").innerHTML = `<div class="section">
    <h2>Active renders <span class="count">${a.length}</span></h2>
    ${a.length ? `<div class="grid">${a.map(activeCard).join("")}</div>`
      : `<div class="empty"><b>Nothing rendering right now.</b><br>Start a job from <a class="nl" href="/">Create video</a> or <a class="nl" href="/motion">Motion control</a>.<br><span class="foot">Finished jobs are in <a class="nl" href="/history">History</a>.</span></div>`}
  </div>`;
}

function renderHistory(d) {
  const h = d.history || [];
  $("main").innerHTML = `<div class="section">
    <h2>History <span class="count">${h.length}</span></h2>
    ${h.length ? `<div class="grid">${h.map(histCard).join("")}</div>` : `<div class="empty"><b>No finished jobs yet.</b></div>`}
  </div>`;
}

function renderDashboard(d) {
  const s = d.stats || {};
  const max = Math.max(1, ...Object.values(d.days || {}));
  const chart = Object.entries(d.days || {}).map(([k, v]) =>
    `<div class="col"><div class="bar2" style="height:${Math.round(100 * v / max)}%" title="${v} on ${k}"></div><div class="lbl">${k.slice(5)}</div></div>`).join("");
  const recent = (d.history || []).slice(0, 6).map(h =>
    `<div class="row"><span class="nm">${esc(h.name)}</span><span class="sub">${KIND(h.kind)}</span>
      <span class="meta">${h.duration_min != null ? h.duration_min.toFixed(0) + " min" : ""} &middot; ${h.finished ? ago(h.finished) : ""}</span></div>`).join("");
  $("main").innerHTML = `
    <div class="tiles">
      <div class="tile"><div class="v">${s.renders || 0}</div><div class="k">Finished renders</div></div>
      <div class="tile"><div class="v">${s.videos || 0}</div><div class="k">Videos made</div></div>
      <div class="tile"><div class="v">${s.minutes || 0}<span style="font-size:14px"> min</span></div><div class="k">Total render time</div></div>
      <div class="tile"><div class="v">${s.week || 0}</div><div class="k">Last 7 days</div></div>
      <div class="tile"><div class="v">${s.disk_mb || 0}<span style="font-size:14px"> MB</span></div><div class="k">Jobs folder</div></div>
    </div>
    <div class="section">
      <h2>Right now</h2>
      ${(d.active || []).length ? `<div class="grid">${d.active.map(activeCard).join("")}</div>`
        : `<div class="empty"><b>GPU idle.</b><br>Nothing queued or rendering.</div>`}
    </div>
    <div class="section">
      <h2>Renders per day</h2>
      <div class="chart">${chart}</div>
    </div>
    <div class="section">
      <h2>Recent</h2>
      <div class="list">${recent || `<div class="row"><span class="sub">No history yet.</span></div>`}</div>
    </div>`;
}

async function tick() {
  let d;
  try { d = await (await fetch("/api/library")).json(); }
  catch (e) { $("main").innerHTML = `<div class="empty">Cannot reach the studio server.</div>`; return; }
  $("comfyDot").className = "dot" + (d.comfy ? " on" : "");
  $("comfyTxt").textContent = !d.comfy ? "ComfyUI not running" : d.running ? "GPU busy: " + d.running : "GPU free";
  if (PAGE === "dashboard") renderDashboard(d);
  else if (PAGE === "history") renderHistory(d);
  else renderJobs(d);
}

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-stop]");
  if (!b) return;
  b.disabled = true;
  await fetch("/api/stop", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: b.dataset.stop }) });
  tick();
});

tick();
setInterval(tick, 2000);
</script>
</body>
</html>
