<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph - Video Studio</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root { --bg:#f6f6f4; --panel:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e2e2de; --accent:#2f6fed; --accent-ink:#fff;
          --accent-soft:#edf2ff; --field:#fbfbfa; --ok:#1f9d55; --warn:#c77800; --bad:#d23c3c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141416; --panel:#1d1d20; --ink:#ececee; --muted:#9a9aa2; --line:#303036;
          --accent:#5b8cff; --accent-ink:#fff; --accent-soft:#1b2436; --field:#18181b; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:14px 20px; border-bottom:1px solid var(--line);
           background:var(--panel); position:sticky; top:0; z-index:3; }
  header h1 { font-size:18px; margin:0 6px 0 0; }
  .tabs { display:flex; gap:4px; flex-wrap:wrap; }
  .tabs a { font-size:13px; color:var(--muted); text-decoration:none; padding:6px 12px; border-radius:999px; }
  .tabs a:hover { background:var(--field); }
  .tabs a.on { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; background:var(--bad); margin-right:6px; }
  .dot.on { background:var(--ok); }
  main { display:grid; grid-template-columns:1fr 300px; gap:0; height:calc(100vh - 57px); }
  @media (max-width:900px) { main { grid-template-columns:1fr; height:auto; } }
  #stage { position:relative; overflow:hidden; }
  #svg { width:100%; height:100%; display:block; }
  .edge { stroke:#94a3b8; stroke-width:1; opacity:.35; }
  .edge.import { stroke:#64748b; stroke-width:1.6; opacity:.55; }
  .edge.uses { stroke:#cbd5e1; stroke-width:.9; opacity:.35; }
  .edge.provides { stroke:#f472b6; stroke-width:1; stroke-dasharray:4 3; opacity:.5; }
  .edge.loaded-by { stroke:#f59e0b; stroke-width:1; stroke-dasharray:2 2; opacity:.6; }
  .edge.data { stroke:#84cc16; stroke-width:1.4; opacity:.55; }
  .edge.fetch { stroke:#14b8a6; stroke-width:1.2; opacity:.5; }
  .edge.link { stroke:#0ea5e9; stroke-width:1; stroke-dasharray:3 3; opacity:.4; }
  .edge.runs { stroke:#8b5cf6; stroke-width:1.6; opacity:.6; }
  .edge.serve { stroke:#22c55e; stroke-width:1.4; opacity:.55; }
  .edge.http { stroke:#ef4444; stroke-width:1; stroke-dasharray:3 3; opacity:.5; }
  .edge.stops { stroke:#ef4444; stroke-width:1; stroke-dasharray:2 2; opacity:.45; }
  .edge.define { stroke:#a3a3a3; stroke-width:.8; opacity:.25; }
  .edge.generates { stroke:#a855f7; stroke-width:1; opacity:.5; }
  .edge.dim { opacity:.06 !important; }
  .edge.hot { opacity:.95 !important; stroke-width:2.5 !important; }
  .node { cursor:pointer; }
  .node circle { stroke:var(--panel); stroke-width:1.5; transition: r 0.2s; }
  .node text { font-size:9px; fill:var(--ink); pointer-events:none; paint-order:stroke; stroke:var(--panel); stroke-width:2.5px; stroke-linejoin:round; }
  .node.dim { opacity:.12; }
  .node.dim text { opacity:0; }
  .node.hot circle { stroke:var(--ink); stroke-width:2.5; }
  .node.hot text { font-weight:700; }
  .node.dragging circle { stroke:var(--accent); stroke-width:3; }
  .g-entry circle { fill:#8b5cf6; } .g-script circle { fill:#2f6fed; } .g-ui circle { fill:#06b6d4; }
  .g-api circle { fill:#14b8a6; } .g-comfy circle { fill:#f59e0b; } .g-pack circle { fill:#ec4899; }
  .g-core circle { fill:#6b7280; } .g-model circle { fill:#10b981; } .g-config circle { fill:#a855f7; }
  .g-binary circle { fill:#ef4444; } .g-data circle { fill:#84cc16; }
  aside { background:var(--panel); border-left:1px solid var(--line); padding:14px; overflow:auto; }
  aside h2 { font-size:14px; margin:0 0 10px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .chip { font-size:12px; border:1px solid var(--line); background:var(--field); color:var(--ink); border-radius:999px;
          padding:4px 10px; cursor:pointer; display:flex; align-items:center; gap:6px; user-select:none; }
  .chip .sw { width:9px; height:9px; border-radius:50%; }
  .chip.off { opacity:.35; text-decoration:line-through; }
  input[type=search] { width:100%; background:var(--field); color:var(--ink); border:1px solid var(--line);
                       border-radius:8px; padding:7px 10px; font:inherit; margin-bottom:12px; }
  #info { font-size:13px; }
  #info .nm { font-weight:700; font-size:14px; word-break:break-word; }
  #info .gp { color:var(--muted); font-size:12px; margin-bottom:8px; }
  #info ul { margin:6px 0 0; padding-left:16px; color:var(--muted); }
  #info li { margin:2px 0; cursor:pointer; }
  #info li:hover { color:var(--ink); }
  .hint { color:var(--muted); font-size:12px; }
  #tip { position:absolute; pointer-events:none; background:var(--ink); color:var(--bg); font-size:12px;
         padding:4px 8px; border-radius:6px; opacity:0; transition:opacity .1s; white-space:nowrap; z-index:4; }
  .btns { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  button { font:inherit; font-size:13px; border-radius:8px; border:1px solid var(--line); background:var(--field);
           color:var(--ink); padding:6px 12px; cursor:pointer; user-select:none; }
  button:hover { background:var(--accent-soft); }
  .zoom-hint { position:absolute; bottom:12px; left:12px; font-size:11px; color:var(--muted); pointer-events:none; z-index:2;
               background:var(--panel); padding:4px 8px; border-radius:6px; border:1px solid var(--line); opacity:.7; }
</style>
</head>
<body>
<header>
  <h1>Video Studio</h1>
  <nav class="tabs">
    <a href="/">Create video</a>
    <a href="/motion">Motion control</a>
    <a href="/jobs">Jobs</a>
    <a href="/history">History</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/graph" class="on">Graph</a>
  </nav>
  <span style="flex:1"></span>
  <span><span id="comfyDot" class="dot"></span><span id="comfyTxt">ComfyUI...</span></span>
</header>
<main>
  <div id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="tip"></div>
    <div class="zoom-hint">Scroll to zoom · Drag background to pan · Drag nodes to move</div>
  </div>
  <aside>
    <h2>Project graph</h2>
    <p class="hint" id="sum">loading...</p>
    <div class="btns">
      <button id="relayout">Re-layout</button>
      <button id="fit">Reset view</button>
      <button id="freeze">Freeze</button>
    </div>
    <input id="q" type="search" placeholder="Search nodes...">
    <div class="chips" id="chips"></div>
    <div id="info"><span class="hint">Click a node to see its connections. Drag nodes to move them.</span></div>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

const COLORS = { entry:"#8b5cf6", script:"#2f6fed", ui:"#06b6d4", api:"#14b8a6", comfy:"#f59e0b",
  pack:"#ec4899", core:"#6b7280", model:"#10b981", config:"#a855f7", binary:"#ef4444", data:"#84cc16" };

const ANCH = { entry:[-.6,0], script:[-.2,-.1], ui:[.05,-.4], api:[.25,-.1], comfy:[.55,-.15],
  pack:[.7,.2], core:[.35,-.55], model:[.75,-.25], config:[-.3,.35], binary:[-.3,.5], data:[.1,.5] };

const W = 1400, H = 900;
let simulation, gNodes, gEdges, gContainer, linkSel, nodeSel;
let nodes = [], links = [], byId = {};
let hidden = new Set(), selected = null, query = "", frozen = false;

function nodeRadius(d) { return 5 + Math.min(7, Math.sqrt(d.deg || 0) * 1.8); }
function showLabel(d) { return (d.deg || 0) >= 2 || d.group === "script" || d.group === "entry" || d.group === "ui"; }

function load(data) {
  nodes = data.nodes.map(n => {
    const a = ANCH[n.group] || [0, 0];
    return { ...n, deg: 0,
      x: W/2 + a[0] * W * 0.4 + (Math.random() - 0.5) * 100,
      y: H/2 + a[1] * H * 0.4 + (Math.random() - 0.5) * 100
    };
  });
  byId = {}; nodes.forEach(n => byId[n.id] = n);

  links = [];
  for (const e of data.edges) {
    const s = byId[e.source], t = byId[e.target];
    if (s && t) {
      s.deg = (s.deg || 0) + 1;
      t.deg = (t.deg || 0) + 1;
      links.push({ source: s, target: t, kind: e.kind });
    }
  }

  $("sum").textContent = `${nodes.length} nodes, ${links.length} edges`;
  renderChips(data.groups || {});
  buildGraph();
}

function buildGraph() {
  const svg = d3.select("#svg");
  svg.selectAll("*").remove();

  // Zoom & pan
  const zoom = d3.zoom()
    .scaleExtent([0.15, 5])
    .on("zoom", e => gContainer.attr("transform", e.transform));
  svg.call(zoom);
  svg.on("dblclick.zoom", null); // disable double-click zoom

  // Arrow markers for directed edges
  const defs = svg.append("defs");
  defs.append("marker").attr("id","arrow").attr("viewBox","0 0 10 6").attr("refX",10).attr("refY",3)
    .attr("markerWidth",8).attr("markerHeight",6).attr("orient","auto")
    .append("path").attr("d","M0,0 L10,3 L0,6 Z").attr("fill","#94a3b8").attr("opacity",.4);

  gContainer = svg.append("g");
  gEdges = gContainer.append("g");
  gNodes = gContainer.append("g");

  // Edges
  linkSel = gEdges.selectAll("line").data(links).join("line")
    .attr("class", d => "edge " + d.kind.replace(/[^a-z0-9]+/gi, "-"))
    .attr("marker-end", "url(#arrow)");

  // Nodes
  nodeSel = gNodes.selectAll("g").data(nodes).join("g")
    .attr("class", d => "node g-" + d.group);

  nodeSel.append("circle")
    .attr("r", nodeRadius);

  nodeSel.append("text")
    .attr("x", d => nodeRadius(d) + 3)
    .attr("y", 3.5)
    .text(d => d.label.length > 28 ? d.label.slice(0, 27) + "…" : d.label)
    .style("display", d => showLabel(d) ? null : "none");

  // Tooltip
  nodeSel.on("mouseenter", (ev, d) => {
    const tip = $("tip");
    tip.textContent = d.label + "  (" + d.group + ")";
    const r = $("stage").getBoundingClientRect();
    tip.style.left = (ev.clientX - r.left + 14) + "px";
    tip.style.top = (ev.clientY - r.top + 14) + "px";
    tip.style.opacity = 1;
  }).on("mouseleave", () => { $("tip").style.opacity = 0; });

  // Click to select
  nodeSel.on("click", (ev, d) => { ev.stopPropagation(); selectNode(d.id); });
  svg.on("click", () => clearSelection());

  // Drag
  const drag = d3.drag()
    .on("start", (ev, d) => {
      if (!ev.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
      d3.select(ev.sourceEvent.target.closest(".node")).classed("dragging", true);
    })
    .on("drag", (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
    .on("end", (ev, d) => {
      if (!ev.active) simulation.alphaTarget(0);
      if (!frozen) { d.fx = null; d.fy = null; }
      d3.select(ev.sourceEvent.target.closest(".node")).classed("dragging", false);
    });
  nodeSel.call(drag);

  // Force simulation
  simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).distance(d => {
      if (d.kind === "uses") return 90;
      if (d.kind === "provides") return 60;
      if (d.kind === "import") return 70;
      return 75;
    }).strength(d => {
      if (d.kind === "provides" || d.kind === "import") return 0.8;
      return 0.4;
    }))
    .force("charge", d3.forceManyBody().strength(d => -120 - d.deg * 15).distanceMax(500))
    .force("center", d3.forceCenter(W / 2, H / 2).strength(0.05))
    .force("cluster", clusterForce(0.15))
    .force("collide", d3.forceCollide().radius(d => nodeRadius(d) + 4).strength(0.7))
    .force("x", d3.forceX(d => { const a = ANCH[d.group] || [0,0]; return W/2 + a[0] * W * 0.4; }).strength(0.08))
    .force("y", d3.forceY(d => { const a = ANCH[d.group] || [0,0]; return H/2 + a[1] * H * 0.4; }).strength(0.08))
    .alphaDecay(0.015)
    .velocityDecay(0.35)
    .on("tick", ticked);

  // Fit to view after stabilisation
  simulation.on("end", () => fitView(svg, zoom));
  setTimeout(() => fitView(svg, zoom), 2500);

  // Store zoom ref for buttons
  svg.__zoom_ref = zoom;
}

function clusterForce(strength) {
  let nds;
  function force(alpha) {
    for (const d of nds) {
      const a = ANCH[d.group] || [0, 0];
      const tx = W/2 + a[0] * W * 0.4;
      const ty = H/2 + a[1] * H * 0.4;
      d.vx += (tx - d.x) * strength * alpha;
      d.vy += (ty - d.y) * strength * alpha;
    }
  }
  force.initialize = n => { nds = n; };
  return force;
}

function ticked() {
  linkSel.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
         .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
}

function fitView(svg, zoom) {
  const box = gContainer.node().getBBox();
  if (!box.width || !box.height) return;
  const stage = $("stage").getBoundingClientRect();
  const pad = 60;
  const scale = Math.min((stage.width - pad*2) / box.width, (stage.height - pad*2) / box.height, 2);
  const tx = stage.width/2 - (box.x + box.width/2) * scale;
  const ty = stage.height/2 - (box.y + box.height/2) * scale;
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
}

function selectNode(id) {
  selected = id;
  const n = byId[id];
  const nb = new Map();
  for (const e of links) {
    if (e.source.id === id) nb.set(e.target.id, e.kind);
    else if (e.target.id === id) nb.set(e.source.id, e.kind);
  }
  nodeSel.classed("hot", d => d.id === id || nb.has(d.id)).classed("dim", d => d.id !== id && !nb.has(d.id));
  linkSel.classed("hot", d => d.source.id === id || d.target.id === id)
         .classed("dim", d => d.source.id !== id && d.target.id !== id);

  // Show all labels for connected nodes
  nodeSel.selectAll("text").style("display", d => (d.id === id || nb.has(d.id) || showLabel(d)) ? null : "none");

  const list = [...nb.entries()].sort((a,b) => a[0].localeCompare(b[0])).map(([k, kind]) => {
    const t = byId[k];
    return `<li onclick="selectNode('${esc(k)}')">${esc(t ? t.label : k)} <span class="hint">(${esc(kind)})</span></li>`;
  }).join("");
  $("info").innerHTML = `<div class="nm">${esc(n.label)}</div><div class="gp">${esc(n.group)} · ${n.deg} connections</div>
    ${list ? `<ul>${list}</ul>` : `<span class="hint">No connections.</span>`}`;
}

function clearSelection() {
  selected = null;
  nodeSel.classed("hot", false).classed("dim", false);
  linkSel.classed("hot", false).classed("dim", false);
  nodeSel.selectAll("text").style("display", d => showLabel(d) ? null : "none");
  $("info").innerHTML = `<span class="hint">Click a node to see its connections. Drag nodes to move them.</span>`;
}

function applyFilters() {
  const q = query.trim().toLowerCase();
  nodeSel.style("display", d => hidden.has(d.group) ? "none" : null);
  if (!selected) {
    nodeSel.classed("dim", d => !!q && !d.label.toLowerCase().includes(q));
  }
  linkSel.style("display", d => {
    if (hidden.has(d.source.group) || hidden.has(d.target.group)) return "none";
    if (q && !d.source.label.toLowerCase().includes(q) && !d.target.label.toLowerCase().includes(q)) return "none";
    return null;
  });
}

function renderChips(groups) {
  const box = $("chips");
  box.innerHTML = Object.keys(COLORS).filter(g => groups[g]).map(g =>
    `<button class="chip" data-g="${g}"><span class="sw" style="background:${COLORS[g]}"></span>${g} ${groups[g]}</button>`).join("");
  box.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    const g = c.dataset.g;
    if (hidden.has(g)) hidden.delete(g); else hidden.add(g);
    c.classList.toggle("off", hidden.has(g));
    applyFilters();
  });
}

// Button handlers
$("relayout").onclick = () => {
  frozen = false;
  $("freeze").textContent = "Freeze";
  nodes.forEach(d => { d.fx = null; d.fy = null; });
  // Scatter nodes to new random positions near their cluster anchor
  nodes.forEach(d => {
    const a = ANCH[d.group] || [0, 0];
    d.x = W/2 + a[0] * W * 0.4 + (Math.random() - 0.5) * 150;
    d.y = H/2 + a[1] * H * 0.4 + (Math.random() - 0.5) * 150;
  });
  simulation.alpha(1).restart();
  clearSelection();
};

$("fit").onclick = () => {
  const svg = d3.select("#svg");
  fitView(svg, svg.__zoom_ref);
};

$("freeze").onclick = () => {
  frozen = !frozen;
  $("freeze").textContent = frozen ? "Unfreeze" : "Freeze";
  if (frozen) {
    simulation.stop();
    nodes.forEach(d => { d.fx = d.x; d.fy = d.y; });
  } else {
    nodes.forEach(d => { d.fx = null; d.fy = null; });
    simulation.alpha(0.3).restart();
  }
};

$("q").oninput = e => { query = e.target.value; applyFilters(); };
window.addEventListener("keydown", e => { if (e.key === "Escape") clearSelection(); });

// Make selectNode global for the info panel click handlers
window.selectNode = selectNode;

// Load data
(async () => {
  try {
    const res = await fetch("/api/graph");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    load(d);
    try {
      const j = await (await fetch("/api/jobs")).json();
      $("comfyDot").className = "dot" + (j.comfy ? " on" : "");
      $("comfyTxt").textContent = !j.comfy ? "ComfyUI loading / offline" : j.running ? "GPU busy: " + j.running : "GPU free";
    } catch (_) {}
  } catch (e) {
    try {
      const d = await (await fetch("../graph.json")).json();
      load(d);
      $("sum").textContent += " (static graph.json)";
    } catch {
      $("sum").textContent = "Could not load graph: " + e.message;
    }
  }
})();
</script>
</body>
</html>
